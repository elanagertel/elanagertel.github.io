<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Elana Gertel — Portfolio</title>
  <!-- Fonts from Google Fonts: Averia Serif Libre (the names' hover texts and contact Me), Crimson Text (project names, captions and years) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Averia+Serif+Libre:ital,wght@0,400;0,700;1,700&family=Crimson+Text:ital,wght@0,400;1,400;1,600&display=swap">
  <link rel="stylesheet" href="styles.css?v=20261201p">
</head>
<body class="home-page">
  <!-- When the opening plays, the bar at the top and the counter wait outside the screen until the big
       name breaks apart (home.js lets them slide in then). Set here, before anything is drawn, so they never blink. -->
  <script>
    if (!new URLSearchParams(location.search).has("gallery") && !matchMedia("(prefers-reduced-motion: reduce)").matches)
      document.body.classList.add("nav-waiting");
  </script>
  <!-- Home page, built from the Figma flow that starts at frame "MacBook Pro 16' - 74":
       black shapes puzzle their way into "ELANA GERTEL" (frames 74 → 72 → 71),
       then break apart into the project gallery (frame 70).
       home.js adds the shapes, the project pictures and their names. -->
  <main class="flow" id="flow">
    <h1 class="visually-hidden">Elana Gertel — Portfolio</h1>
  </main>

  <!-- The bar at the top, on every page, fixed while scrolling (Figma: "MacBook Pro 16' - 83", y 19).
       Hovering "Contact me" types out the contact details next to it (contact.js). -->
  <nav class="site-nav" aria-label="Site">
    <p class="site-nav-item flow-contact" style="--x: 65">Contact me  /</p>
    <a class="site-nav-item site-nav-about" style="--x: 592" href="about.html">About Me  /</a>
    <a class="site-nav-item site-nav-home" style="--x: 855" href="index.html?gallery">Home  /</a>
    <a class="site-nav-item site-nav-name" href="index.html">ELANA GERTEL</a>
  </nav>

  <!-- How many projects there are, and the number of the picture under the mouse (Figma: "0" and "/  07",
       on both sides in the middle of the screen). home.js sets the numbers. -->
  <p class="fold-count fold-count-now" aria-hidden="true">0</p>
  <p class="fold-count fold-count-total" aria-hidden="true">/  0</p>

  <!-- The planned puzzle moves first, then the code that plays them -->
  <!-- ?v=… : change the number after an update, so browsers load the new files instead of old saved copies -->
  <!-- Phones: the rotate prompt and the tap effects (first, so the other scripts can use them) -->
  <script src="mobile.js?v=20261125a"></script>
  <script src="phone.js?v=20261201i"></script>
  <script src="home-moves.js?v=20261124d"></script>
  <script src="hover-moves.js?v=20261113b"></script>
  <script src="to-lab-moves.js?v=20261117b"></script>
  <script src="to-cactus-moves.js?v=20261117b"></script>
  <script src="to-sense-moves.js?v=20261117b"></script>
  <script src="to-archive-moves.js?v=20261117b"></script>
  <script src="page-change.js?v=20261201f"></script>
  <script src="home.js?v=20261125b"></script>
  <!-- The mouse drips into a blob while it pushes a big letter -->
  <script src="home-cursor.js?v=20261124b"></script>
  <script src="contact.js?v=20261125i"></script>
  <script src="type-texts.js?v=20261201c"></script>
</body>
</html>
