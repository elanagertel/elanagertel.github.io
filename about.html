<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>About — Elana Gertel</title>
  <!-- The icon in the browser tab: a black square on white -->
  <link rel="icon" href="favicon.svg?v=3" type="image/svg+xml">
  <!-- Fonts from Google Fonts: Averia Serif Libre (the small texts, the names' hover texts and contact Me), Crimson Text -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Averia+Serif+Libre:ital,wght@0,400;0,700;1,700&family=Crimson+Text:ital,wght@0,400;1,400&display=block">
  <link rel="stylesheet" href="styles.css?v=20261204q">
  <!-- Show the page only once everything is in place (the marker "page-ready" comes after the scripts),
       so going from page to page nothing shows for a moment in the wrong place (no blinking) -->
  <link rel="expect" href="#page-ready" blocking="render">
  <!-- Coming from another page: what is going to slide in stays hidden from the very first moment, and
       coming from the black end of a project the screen stays black (some browsers, like Safari, show the
       page before its scripts have run: without this it shows for a moment, like a blink). page-change.js
       takes it away once things are ready (and, just in case, it goes away by itself after 3 seconds). -->
  <script>
    (function () {
      var root = document.documentElement, now = Date.now();
      try {
        var slide = JSON.parse(sessionStorage.getItem("slideInPage") || "null");
        var end = Number(sessionStorage.getItem("fromProjectEnd") || 0);
        if (end && now - end < 10000) root.classList.add("from-end");
        else if (slide && now - slide.at < 10000) root.classList.add("is-arriving");
      } catch (e) {}
      setTimeout(function () { root.classList.remove("from-end", "is-arriving"); }, 3000);
    })();
  </script>
</head>
<body class="lab-page">
  <!-- The "About" page, built from Figma frames "Desktop - 1" (HI, my name is..), "Desktop - 2" (ELANA)
       and Frame 173 (the rest of the sentence). The screen stays in place while you scroll. Scrolling makes
       the page seem to move to the right: each word slides to the left, and its black shapes jump to build
       the next word (HI → ELANA → DESIGNER → … → SOLUTIONS), over the small texts in between.
       Shapes that are missing come in from the left edge; shapes that are not needed leave there.
       about.js moves everything, according to how far you have scrolled. -->
  <main class="about" id="about">
    <h1 class="visually-hidden">About — Hi, my name is Elana</h1>

    <!-- The screen that stays in place while you scroll (the page is taller than the screen, so you can scroll) -->
    <div class="about-stage" id="about-stage">
      <!-- about.js puts the small texts ("my name is..", "I am a...", …) and the black shapes here -->
      <div class="about-pieces" id="about-pieces" aria-hidden="true"></div>
    </div>

    <!-- The bar at the top, on every page, fixed while scrolling (Figma: "MacBook Pro 16' - 83", y 19).
         Hovering "Contact me" types out the contact details next to it (contact.js). -->
    <nav class="site-nav" aria-label="Site">
      <p class="site-nav-item flow-contact" style="--x: 985.5">Contact me  /</p>
      <a class="site-nav-item site-nav-about" style="--x: 593" href="about.html">About Me  /</a>
      <a class="site-nav-item site-nav-home" style="--x: 328.5" href="index.html?gallery">Home  /</a>
      <a class="site-nav-item site-nav-name" href="index.html">ELANA GERTEL</a>
    </nav>
  </main>

  <!-- The words and their shapes (from Figma) first, then the code that moves them -->
  <!-- Phones: the rotate prompt and the tap effects (first, so the other scripts can use them) -->
  <script src="mobile.js?v=20261125a"></script>
  <script src="phone.js?v=20261204t"></script>
  <script src="about-words.js?v=20261114a"></script>
  <script src="about.js?v=20261202b"></script>
  <script src="page-change.js?v=20261204a"></script>
  <!-- The cursor: a small square piece on "exclusion" (computers with a mouse) -->
  <script src="cursor.js?v=20261204a"></script>
  <script src="contact.js?v=20261204a"></script>
  <!-- The page shows only from here on (see "page-ready" at the top) -->
  <div id="page-ready"></div>
</body>
</html>
